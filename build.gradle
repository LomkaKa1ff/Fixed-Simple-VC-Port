plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
tasks.register('collectJars', Copy) {
    description = 'Build selected targets and copy their JARs to dist.'
    subprojects.each { p ->
        dependsOn "${p.path}:jar"
        from(p.layout.buildDirectory.dir('libs')) { include '*.jar'; exclude '*-sources.jar' }
    }
    into layout.projectDirectory.dir('dist')
}
tasks.named('build') { dependsOn subprojects.collect { "${it.path}:build" } }
